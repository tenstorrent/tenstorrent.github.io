name: QuietBox 2 PDF sync check

# The script (scripts/check_quietbox2_pdf_sync.sh) decides which files require
# a PDF refresh. This path filter only decides when the job runs, and it
# covers the whole QuietBox 2 directory so image replacements are included.
#
# Do not mark this job as a required status check. A path-filtered workflow
# does not run on unrelated PRs, and GitHub treats a missing required check
# as failed, which would block those PRs forever.

on:
  pull_request:
    paths:
      - "core/systems/quietbox/quietbox-bh-2/**"
      - "scripts/check_quietbox2_pdf_sync.sh"
      - "scripts/quietbox2_pdf.md"
      - ".github/workflows/quietbox2_pdf_sync.yml"

jobs:
  check-pdf-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDF updated when QuietBox 2 sources change
        run: |
          chmod +x scripts/check_quietbox2_pdf_sync.sh
          # Merge-commit checkout: first parent is the base this PR was tested against.
          scripts/check_quietbox2_pdf_sync.sh "HEAD^1"
